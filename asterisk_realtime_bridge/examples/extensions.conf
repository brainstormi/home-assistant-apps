; Asterisk dialplan for the Asterisk Realtime Bridge (template).
;
; Replace the placeholders before using it:
;   <trunk-endpoint>   your PJSIP trunk endpoint (pjsip.conf), e.g. my-provider
;   <caller-id>        the number your trunk requires as caller ID (or remove the line)
;   <allowed-number-N> phone numbers allowed to call the assistant
;   <inbound-context>  the context your trunk delivers incoming calls to
;
; After editing: "dialplan reload" in the Asterisk CLI, and check that it logs
; no "Unable to register extension" warning.

; ---------------------------------------------------------------- incoming
; Incoming calls from the trunk: only allowed numbers reach the assistant.
[<inbound-context>]
exten => s,1,NoOp(Incoming call for Home Assistant from ${CALLERID(num)})
 ; Trunk test (first rule): our own line calling while a test is pending.
 ; Report it to the bridge and hang up WITHOUT answering: nothing rings.
 same => n,GotoIf($["${TRUNK_TEST}" != "" & "${CALLERID(num):-9}" = "${TRUNK_TEST_NUM:-9}"]?trunktest)
 same => n,GotoIf($["${CALLERID(num)}" = "<allowed-number-1>"]?allowed)
 same => n,GotoIf($["${CALLERID(num)}" = "<allowed-number-2>"]?allowed)
 ; Add one line per number (with and without the country prefix, if your
 ; trunk sends both forms).
 same => n,NoOp(Blocked call from ${CALLERID(num)})
 same => n,Hangup(21)
 same => n(allowed),Answer()
 ; Pack the caller's number into the AudioSocket UUID (the bridge reads it).
 same => n,Set(N=${FILTER(0123456789,${CALLERID(num)})})
 same => n,Set(N=${N:-20})
 same => n,Set(L=00${LEN(${N})})
 same => n,Set(P=00000000000000000000${N})
 same => n,Set(P=${P:-20})
 same => n,Set(R=0000${RAND(0,9999)})
 same => n,AudioSocket(ca11e0${L:-2}-${R:-4}-${P:0:4}-${P:4:4}-${P:8:12},127.0.0.1:9092)
 same => n,Hangup()
 same => n(trunktest),Originate(Local/7e57a100${TRUNK_TEST:8}@bridge-report,app,Wait,3)
 same => n,Hangup(17)

; ---------------------------------------------------------------- outbound
; Home Assistant runs (through the Asterisk app's stdin):
;   channel originate Local/<number>_<call_id>@bridge-outbound extension <call_id>@bridge-notice
[bridge-outbound]
exten => _X.,1,Set(NUM=${CUT(EXTEN,_,1)})
 same => n,Set(CALL=${CUT(EXTEN,_,2)})
 same => n,Set(CALLERID(num)=<caller-id>)
 same => n,Dial(PJSIP/${NUM}@<trunk-endpoint>,30)
 same => n,GotoIf($["${CALL}" = "" | "${DIALSTATUS}" = "ANSWER"]?done)
 ; Not answered: tell the bridge why (a short report connection, not a call).
 same => n,Set(LIST=NOANSWER-BUSY-CONGESTION-CHANUNAVAIL-CANCEL-DONTCALL-TORTURE-INVALIDARGS-ANSWER)
 same => n,Set(CODE=00${FIELDNUM(LIST,-,${DIALSTATUS})})
 same => n,Originate(Local/fa1100${CODE:-2}${CALL:8}@bridge-report,app,Wait,3)
 same => n(done),Hangup()

; Answered: connect the phone to the bridge with the call id.
[bridge-notice]
exten => _[0-9a-f].,1,NoOp(Notice ${EXTEN} answered)
 same => n,Answer()
 same => n,AudioSocket(${EXTEN},127.0.0.1:9092)
 same => n,Hangup()

; Optional and not recommended (see DOCS): detect answering machines with AMD() first
; (dial "extension <call_id>@bridge-notice-amd"). It delays every answered call and, on
; this Local channel, may receive no audio at all. The assistant's detection
; (detect_voicemail) needs none of this.
[bridge-notice-amd]
exten => _[0-9a-f].,1,Answer()
 ; Mobile networks may send no audio while the other end is silent: the jitter
 ; buffer fills the gaps so that AMD() keeps hearing (silence) and can decide.
 same => n,Set(JITTERBUFFER(adaptive)=default)
 same => n,AMD()
 same => n,Set(JITTERBUFFER(disabled)=)
 same => n,GotoIf($["${AMDSTATUS}" = "MACHINE"]?machine)
 same => n,AudioSocket(${EXTEN},127.0.0.1:9092)
 same => n,Hangup()
 same => n(machine),Set(LIST=INITIALSILENCE-LONGGREETING-MAXWORDS-MAXWORDLENGTH-TOOLONG-HUMAN)
 same => n,Set(CODE=00${FIELDNUM(LIST,-,${CUT(AMDCAUSE,-,1)})})
 same => n,AudioSocket(a3d000${CODE:-2}${EXTEN:8},127.0.0.1:9092)
 same => n,Hangup()

; Stops a withdrawn call that is still ringing (sent by the bridge).
[bridge-kill]
exten => _X.,1,SoftHangup(Local/${EXTEN}@bridge-outbound,a)
 same => n,Hangup()

; Trunk test: the bridge sends "channel originate Local/<own number>_<test id>@bridge-trunk-test
; application Wait 1". It calls our own line through the trunk; if the call comes back in,
; the incoming context reports it (see the trunk test lines there) without answering.
[bridge-trunk-test]
exten => _X.,1,Set(NUM=${CUT(EXTEN,_,1)})
 same => n,Set(TEST=${CUT(EXTEN,_,2)})
 same => n,Set(GLOBAL(TRUNK_TEST)=${TEST})
 same => n,Set(GLOBAL(TRUNK_TEST_NUM)=${NUM})
 same => n,Set(CALLERID(num)=<caller-id>)
 same => n,Dial(PJSIP/${NUM}@<trunk-endpoint>,15)
 same => n,Set(GLOBAL(TRUNK_TEST)=)
 same => n,Set(LIST=NOANSWER-BUSY-CONGESTION-CHANUNAVAIL-CANCEL-DONTCALL-TORTURE-INVALIDARGS-ANSWER)
 same => n,Set(CODE=00${FIELDNUM(LIST,-,${DIALSTATUS})})
 same => n,Originate(Local/7e5700${CODE:-2}${TEST:8}@bridge-report,app,Wait,3)
 same => n,Hangup()

; Reports for the bridge (dial status of outbound calls and trunk tests).
[bridge-report]
exten => _fa11.,1,Answer()
 same => n,AudioSocket(${EXTEN},127.0.0.1:9092)
 same => n,Hangup()
exten => _7e57.,1,Answer()
 same => n,AudioSocket(${EXTEN},127.0.0.1:9092)
 same => n,Hangup()
